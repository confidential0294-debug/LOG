# Render service definition
services:
  - type: web
    name: mcp-server
    env: python
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mcp_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER_SERVICE_NAME
        value: mcp-server
